services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?Define REDIS_PASSWORD in .env}@redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Define REDIS_PASSWORD in .env}
      SESSION_BINDING_SECRET: ${SESSION_BINDING_SECRET:?Define SESSION_BINDING_SECRET in .env}
      ADMIN_DASHBOARD_KEY: ${ADMIN_DASHBOARD_KEY:?Define ADMIN_DASHBOARD_KEY in .env}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Define REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Define REDIS_PASSWORD in .env}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
